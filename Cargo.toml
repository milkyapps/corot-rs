[workspace]
members = [".", "corot-macros"]
resolver = "2"

[package]
name = "corot-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
serde = ["dep:serde", "corot-macros/serde"]

[dependencies]
corot-macros = { path = "corot-macros" }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "with_serde"
required-features = ["serde"]
